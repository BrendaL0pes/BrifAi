[project]
name = "brifai"
version = "0.1.0"
description = "Automated news briefing system with AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agno>=2.6.1",
    "groq>=1.2.0",
    "python-dotenv>=1.2.2",
    "discord.py>=2.3",       # M2 — bot conversacional
    "httpx>=0.27",           # M4 — fetcher async (nunca usar requests)
    "apscheduler>=3.10",     # M4 — scheduler
]
 
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",  # obrigatório para testar funções async
    "ruff>=0.4",
]
 
[tool.pytest.ini_options]
asyncio_mode = "auto"        # todos os testes async rodam sem @pytest.mark.asyncio

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

